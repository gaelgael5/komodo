# ---------------------------------------------------------------------------
# Déclaration des Stacks (déploiements docker compose) gérées par Komodo.
#
# Vide pour l'instant : les exemples ci-dessous montrent les deux patterns
# habituels. Schéma complet :
# https://docs.rs/komodo_client/latest/komodo_client/entities/stack/struct.StackConfig.html
# ---------------------------------------------------------------------------

## Exemple 1 : stack dont le compose vit dans un dépôt Git (recommandé —
## tout l'état est versionné ; le Periphery clone le dépôt sur son hôte).
# [[stack]]
# name = "exemple-app"
# description = "Application exemple, compose versionné dans Git"
# tags = ["homelab"]
# # deploy = true          # la sync (re)déploie si config/version changent
# [stack.config]
# server = "docker-host-01"          # cf. servers.toml
# repo = "mon-compte/mon-depot-stacks"
# branch = "main"
# # git_account = "mon-compte"       # requis si dépôt privé
# file_paths = ["exemple-app/compose.yaml"]
# # environment = """
# # VARIABLE_1 = valeur
# # """

## Exemple 2 : stack dont le compose existe déjà sur l'hôte
## (sous PERIPHERY_ROOT_DIRECTORY, ex. /etc/komodo/stacks/exemple/compose.yaml).
# [[stack]]
# name = "exemple-local"
# tags = ["homelab"]
# [stack.config]
# server = "docker-host-01"
# files_on_host = true
# run_directory = "stacks/exemple"
# file_paths = ["compose.yaml"]
